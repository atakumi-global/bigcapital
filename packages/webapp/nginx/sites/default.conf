# WebSocket upgrade support (socket.io). conf.d files are included in the
# http context, so this map is valid here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Resolve the upstream via Docker's embedded DNS at request time, so nginx
    # does not fail to start when the server container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Server-generated public assets (PDF documents, mail templates preview).
    location /public/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
