# Bigcapital (fork) — Coolify deployment.
#
# Deploy: Coolify → New Resource → Docker Compose (git source) → pick this file.
# Set the domain on the `webapp` service only; every other service stays
# internal on the compose network. Secrets marked SERVICE_* are generated
# once by Coolify and reused across redeploys.
#
# Required manual variables before deploy: none blocking, but set MAIL_*
# for invite/reset emails and S3_* for document attachments (see
# .env.coolify.example).

services:
  # Public entrypoint: serves the SPA and proxies /api and /public to server.
  webapp:
    build:
      context: ./
      dockerfile: packages/webapp/Dockerfile
    image: bigcapital-fork-webapp
    environment:
      - SERVICE_FQDN_WEBAPP_80
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    image: bigcapital-fork-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Application
      - BASE_URL=${SERVICE_URL_WEBAPP}
      - JWT_SECRET=${SERVICE_BASE64_64_JWT}
      # Database (keep in sync with database_migration below)
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-bigcapital}
      - DB_PASSWORD=${SERVICE_PASSWORD_64_MYSQL}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
      # Redis / queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379
      - QUEUE_PASSWORD=${SERVICE_PASSWORD_REDIS}
      # Mail (optional at boot; required for invites/password resets)
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Bigcapital}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      # Sign-up
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-false}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS:-}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS:-}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}
      # Gotenberg PDF generator (internal)
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/
      # S3 document attachments (effectively required for attachments)
      - S3_REGION=${S3_REGION:-US}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      # Optional integrations
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-open-exchange-rate}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID:-}
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED:-false}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK:-}
      - WISE_API_TOKEN=${WISE_API_TOKEN:-}
      - WISE_API_BASE_URL=${WISE_API_BASE_URL:-https://api.wise.com/2026Q3}
      - WISE_PROFILE_ID=${WISE_PROFILE_ID:-}
      - WISE_WEBHOOK_SECRET=${WISE_WEBHOOK_SECRET:-}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-}
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY:-}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY:-}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID:-}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET:-}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL:-}
    volumes:
      # Generated PDF documents scratch dir (ChromiumlyTenancy).
      - server-public:/app/packages/server/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      database_migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot schema migration job. Runs the same image as server; exits.
  # working_dir matters: system migrations resolve ./src/database relative
  # to the process CWD (see common/config/system-database.ts).
  database_migration:
    image: bigcapital-fork-server
    working_dir: /app/packages/server
    command:
      [
        "sh",
        "-c",
        "node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest",
      ]
    environment:
      # Keep in sync with the Database block on server above.
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-bigcapital}
      - DB_PASSWORD=${SERVICE_PASSWORD_64_MYSQL}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  mysql:
    build:
      context: ./docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital_system}
      - MYSQL_USER=${DB_USER:-bigcapital}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_64_MYSQL}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MYSQLROOT}
      # Consumed by docker-entrypoint.sh to scope the tenant GRANT wildcard.
      - TENANT_DB_PREFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  redis:
    build:
      context: ./docker/redis
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command:
      [
        "sh",
        "-c",
        'redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  server-public:
