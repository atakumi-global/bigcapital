# Fast-forwards the `prod` branch to the current tip of `stage`.
# Fails safely when the update is not a fast-forward (prod has diverged).
name: Promote to production
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward prod to stage
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote stage to prod
        run: |
          git fetch origin stage prod
          echo "Promoting $(git rev-parse --short origin/stage) to prod"
          git push origin origin/stage:refs/heads/prod
