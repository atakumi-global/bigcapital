# Fast-forwards the `stage` branch to the current tip of `dev`.
# Fails safely when the update is not a fast-forward (stage has diverged).
# Pure shell git: no JS actions, so nothing runs on the runner's Node.
name: Promote to stage
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward stage to dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Promote dev to stage
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin dev stage
          echo "Promoting $(git rev-parse --short refs/remotes/origin/dev) to stage"
          git push origin "refs/remotes/origin/dev:refs/heads/stage"
